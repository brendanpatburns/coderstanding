[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coderstanding"
version = "0.2.0"
description = "Scan a code base and show its classes and connections as a graph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "tomli; python_version < '3.11'",
    "tree-sitter>=0.23",
    "tree-sitter-c-sharp",
    "tree-sitter-gdscript",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-html",
]

[project.optional-dependencies]
dev = ["pytest"]
tray = ["PySide6"]  # the optional tray icon (`coderstanding tray`)

[project.scripts]
coderstanding = "coderstanding.cli:main"

# viewer/ and docs/ stay at the repo root for checkouts; the wheel ships them inside the package
# (coderstanding/viewer, coderstanding/docs) and coderstanding.assets finds either place.
[tool.setuptools]
packages = ["coderstanding", "coderstanding.languages", "coderstanding.viewer",
            "coderstanding.viewer.vendor", "coderstanding.docs", "coderstanding.docs.skill"]

[tool.setuptools.package-dir]
"" = "scanner"
"coderstanding.viewer" = "viewer"
"coderstanding.docs" = "docs"

[tool.setuptools.package-data]
"coderstanding.viewer" = ["*.html", "*.js", "*.css", "*.json"]
"coderstanding.viewer.vendor" = ["*"]
"coderstanding.docs" = ["FOR_CLAUDE.md"]
"coderstanding.docs.skill" = ["SKILL.md"]

[tool.pytest.ini_options]
pythonpath = ["scanner"]
testpaths = ["tests"]
